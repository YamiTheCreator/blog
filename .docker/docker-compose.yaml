name: 'Blog'

services:
    mysql:
        image: 'mysql:8.0'
        container_name: 'mysql'
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: 'root'
            MYSQL_DATABASE: 'bd'
            MYSQL_USER: 'root'
            MYSQL_PASSWORD: 'root'
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    mysql_data:
        driver: local

